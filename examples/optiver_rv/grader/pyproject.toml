[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiver-coral-grader"
version = "0.1.3"
requires-python = ">=3.11,<3.14"
dependencies = ["coral", "numpy==1.26.4", "pandas==2.2.3", "pyarrow==19.0.1", "psutil==5.9.6"]

[tool.setuptools.packages.find]
where = ["src"]
